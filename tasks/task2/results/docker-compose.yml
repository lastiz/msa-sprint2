services:
  monolith:
    build:
      context: ../../monolith
      dockerfile: Dockerfile
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

  kafka-init:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic booking.created --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --describe --topic booking.created
    restart: "no"
    networks:
      - hotelio-net

  booking-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - hotelio-net

  history-db:
    image: postgres:15
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    volumes:
      - history-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelio -d hotelio"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - hotelio-net

  booking-service:
    build:
      context: ../booking-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://hotelio:hotelio@booking-db:5432/hotelio
      MONOLITH_URL: http://monolith:8080
      KAFKA__SERVERS: kafka:9092
      KAFKA__TOPIC: booking.created
    depends_on:
      booking-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - hotelio-net

  booking-history-service:
    build:
      context: ../booking-history-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://hotelio:hotelio@history-db:5432/hotelio
      KAFKA__SERVERS: kafka:9092
      KAFKA__TOPIC: booking.created
    depends_on:
      history-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - hotelio-net

  grpcurl:
    image: fullstorydev/grpcurl:v1.9.3
    profiles: [tools]
    volumes:
      - ../booking.proto:/proto/booking.proto:ro
    networks:
      - hotelio-net

volumes:
  booking-db-data:
  history-db-data:
  monolith-db-data:

networks:
  hotelio-net:
    external: true
